# ============================================================
# AI Financial Coach — Docker Compose
# ============================================================

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: financial-coach-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: financial_coach
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: financial-coach-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/financial_coach
      LLM_PROVIDER: ${LLM_PROVIDER:-greennode}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # GreenNode AgentBase — AI Agent endpoint for AI Coach
      GREENNODE_AI_AGENT_URL: ${GREENNODE_AI_AGENT_URL:-}
      GREENNODE_AI_AGENT_API_KEY: ${GREENNODE_AI_AGENT_API_KEY:-}
      GREENNODE_AI_AGENT_TIMEOUT_MS: ${GREENNODE_AI_AGENT_TIMEOUT_MS:-30000}
    ports:
      - "8080:8080"

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: financial-coach-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
